<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengolah Nilai Mahasiswa</title>
    <link rel="icon" href="data:,">
</head>
<body>
    <h1>Pengolah Nilai Mahasiswa</h1>

    <script>
        // data mahasiswa
        const nama = "Syeikhal Islami";
        let nilaiTugas = 80;
        let nilaiUTS = 75;
        let nilaiUAS = 90;

        // hitung nilai akhir dengan bobot Tugas 30%, UTS 30%, UAS 40%
        let nilaiAkhir = (nilaiTugas * 30 / 100) + (nilaiUTS * 30 / 100) + (nilaiUAS * 40 / 100);

        // tentukan status kelulusan
        let status;
        if (nilaiAkhir >= 60) {
            status = "LULUS";
        } else {
            status = "TIDAK LULUS";
        }

        // tampilkan hasil di console
        console.log("Nama Mahasiswa:", nama);
        console.log("Nilai Akhir:", nilaiAkhir);
        console.log("Status Kelulusan:", status);
    </script>
</body>
</html>
